services:
  - type: web
    name: kira-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run prisma:generate -w server
    preDeployCommand: npm run prisma:deploy -w server
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
